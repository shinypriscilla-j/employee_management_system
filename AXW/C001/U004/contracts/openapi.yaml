openapi: 3.1.0
info:
  title: Employee Management API — Employee Profile (AXW-C001-U004)
  version: 1.0.0
  description: >-
    Read-only employee profile for unit AXW-C001-U004 (employee-profile-view).
    DRAFT — pending human approval. Server host and the sign-in mechanism are UNRESOLVED
    (owner: Shiny Priscilla J); no concrete host or token URL is given on purpose.
servers:
  - url: /api/v1
    description: Relative base path. Host UNRESOLVED (owner Shiny Priscilla J).
tags:
  - name: employee-profile
    description: Employee profile view (AXW-C001-U004)
paths:
  /employees/{employeeId}:
    get:
      operationId: getEmployeeProfile
      tags:
        - employee-profile
      summary: Get the profile of one employee the viewer is permitted to see
      description: >-
        Returns one active employee's directory information, immediate manager and active direct
        reports, read as one consistent snapshot. All-or-nothing: no partial profile is ever
        returned (A3). The subject must be an active employee in the viewer's permitted set;
        otherwise the response is 404 `profile_not_available`, identical for "not permitted",
        "inactive", "unknown" and "malformed" so that existence is never revealed (Q4).
        A related employee carries an `employeeId` only when it is in the viewer's permitted set
        (link); otherwise `employeeId` is null (plain text) (Q2).
        Direct reports are ordered by name A–Z (case-insensitive, then employee ID) and are not
        paginated (Q5). View only: no side effects, safe to repeat.
        Satisfies R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R16, R17, R18,
        R19, R20, R21, R22, R23, R24, R25, R26, R27.
      security:
        - viewerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: The profile. Satisfies R2–R14, R16, R20.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
              examples:
                managerWithReports:
                  summary: HR user Priya views Ravi (R4, R5, R13)
                  value:
                    employeeId: E20001
                    name: Ravi Kumar
                    designation: Finance Manager
                    department: Finance
                    workEmail: ravi.kumar@company.example
                    workPhone: '+44 20 7946 0100'
                    manager:
                      employeeId: E00001
                      name: Anita Rao
                      designation: Chief Executive Officer
                    directReports:
                      - employeeId: E10101
                        name: Anil Shah
                        designation: Accounts Assistant
                      - employeeId: E10234
                        name: Arjun Mehta
                        designation: Accountant
                      - employeeId: E10312
                        name: Bala Iyer
                        designation: Payroll Officer
                ownProfilePlainTextManager:
                  summary: Employee Arjun views his own profile; manager not openable (R11, R14)
                  value:
                    employeeId: E10234
                    name: Arjun Mehta
                    designation: Accountant
                    department: Finance
                    workEmail: arjun.mehta@company.example
                    workPhone: '+44 20 7946 0123'
                    manager:
                      employeeId: null
                      name: Ravi Kumar
                      designation: Finance Manager
                    directReports: []
                missingValuesNoManager:
                  summary: Kiran has no department, designation or phone; manager inactive (R6, R20)
                  value:
                    employeeId: E10777
                    name: Kiran Das
                    designation: null
                    department: null
                    workEmail: kiran.das@company.example
                    workPhone: null
                    manager: null
                    directReports: []
        '401':
          description: >-
            Not signed in. Owned by the project baseline (sign-in); mechanism UNRESOLVED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: Sign in to continue.
                      requestId: 3f1c2a9e-7b1d-4c55-9a0e-1d2b3c4d5e6f
        '404':
          description: >-
            `profile_not_available` — subject outside the viewer's permitted set, inactive,
            unknown or malformed; the viewer has no permitted set. Body identical in every case.
            Satisfies R17, R18, R19, R21, R22, R25, R26, R27.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                profileNotAvailable:
                  value:
                    error:
                      code: profile_not_available
                      message: Profile not available
                      requestId: 8a7b6c5d-4e3f-4a1b-9c8d-7e6f5a4b3c2d
        '500':
          description: Unexpected server fault. Project-baseline error model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                internalError:
                  value:
                    error:
                      code: internal_error
                      message: Something went wrong.
                      requestId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        '503':
          description: >-
            `employee_details_unavailable` — the employee records could not be read (down or
            timed out). Not a refusal; safe to retry. Satisfies R24.
          headers:
            Retry-After:
              description: Seconds after which the client may retry.
              schema:
                type: integer
                format: int32
                minimum: 1
                maximum: 60
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                detailsUnavailable:
                  value:
                    error:
                      code: employee_details_unavailable
                      message: Profile temporarily unavailable. Try again.
                      requestId: 5c4b3a29-1807-4f6e-8d5c-4b3a29180716
components:
  securitySchemes:
    viewerAuth:
      type: http
      scheme: bearer
      description: >-
        UNRESOLVED (owner Shiny Priscilla J): identity provider, token format and how the
        viewer's employee ID and HR role reach the API. The API needs only a Viewer
        { employeeId: string | null, isHr: boolean } from it.
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: >-
        Employee ID of the profile subject, e.g. E10234. Any value that does not identify an
        active employee in the viewer's permitted set — including a malformed one such as
        "abc!!" or one longer than 64 characters — yields 404 `profile_not_available`, never
        400 (R21, R22).
      schema:
        type: string
        minLength: 1
      example: E10234
  headers:
    CacheControlNoStore:
      description: Responses depend on the viewer's permitted set and must not be cached.
      schema:
        type: string
        enum:
          - no-store
  schemas:
    EmployeeProfile:
      type: object
      title: EmployeeProfile
      description: One employee's profile as the viewer may see it. Directory information only (OUT-1).
      additionalProperties: false
      required:
        - employeeId
        - name
        - designation
        - department
        - workEmail
        - workPhone
        - manager
        - directReports
      properties:
        employeeId:
          type: string
          description: Employee ID of the profile subject.
          example: E10234
        name:
          type: string
          description: Full name.
          example: Arjun Mehta
        designation:
          type:
            - string
            - 'null'
          description: Job title; the same value as "role" in the Employee List (Q1). Null when not recorded (UI shows "Not assigned", A4).
          example: Accountant
        department:
          type:
            - string
            - 'null'
          description: Department. Null when not recorded (UI shows "Not assigned", A4).
          example: Finance
        workEmail:
          type: string
          format: email
          description: Work email address.
          example: arjun.mehta@company.example
        workPhone:
          type:
            - string
            - 'null'
          description: Work phone as recorded. Null when not recorded (UI shows "Not recorded", A4).
          example: '+44 20 7946 0123'
        manager:
          description: Immediate manager, or null when there is no manager or the manager is inactive (Q3).
          oneOf:
            - $ref: '#/components/schemas/RelatedEmployee'
            - type: 'null'
        directReports:
          type: array
          description: Every active direct report, ordered by name A–Z then employee ID; never paginated (Q5). Empty when there are none.
          items:
            $ref: '#/components/schemas/RelatedEmployee'
      example:
        employeeId: E10234
        name: Arjun Mehta
        designation: Accountant
        department: Finance
        workEmail: arjun.mehta@company.example
        workPhone: '+44 20 7946 0123'
        manager:
          employeeId: E20001
          name: Ravi Kumar
          designation: Finance Manager
        directReports: []
    RelatedEmployee:
      type: object
      title: RelatedEmployee
      description: The manager or a direct report, shown by name and designation. Always active.
      additionalProperties: false
      required:
        - employeeId
        - name
        - designation
      properties:
        employeeId:
          type:
            - string
            - 'null'
          description: Present only when this employee is in the viewer's permitted set (shown as a link); null otherwise (plain text) (Q2).
          example: E20001
        name:
          type: string
          description: Full name.
          example: Ravi Kumar
        designation:
          type:
            - string
            - 'null'
          description: Job title; null when not recorded.
          example: Finance Manager
      example:
        employeeId: null
        name: Ravi Kumar
        designation: Finance Manager
    ErrorEnvelope:
      type: object
      title: ErrorEnvelope
      description: Shared error envelope (proposed project convention).
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      example:
        error:
          code: profile_not_available
          message: Profile not available
          requestId: 8a7b6c5d-4e3f-4a1b-9c8d-7e6f5a4b3c2d
    ErrorBody:
      type: object
      title: ErrorBody
      description: Error details. `code` is contract; `message` is informational only.
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: Stable reason code.
          enum:
            - employee_details_unavailable
            - internal_error
            - profile_not_available
            - unauthenticated
        message:
          type: string
          description: Human-readable text; clients must not branch on it.
        requestId:
          type: string
          format: uuid
          description: Correlates the response with logs and traces.
      example:
        code: employee_details_unavailable
        message: Profile temporarily unavailable. Try again.
        requestId: 5c4b3a29-1807-4f6e-8d5c-4b3a29180716
